[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "developer-cli-toolkit"
version = "0.1.0"
description = "Small developer productivity checks for portfolio use."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joel Qvint" }]
dependencies = []

[project.scripts]
devtoolkit = "devtoolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

